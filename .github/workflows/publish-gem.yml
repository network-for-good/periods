name: Publish gem to GitHub Packages

# Runs on every push to main. Whether a merge "warrants a release" is decided by the version itself:
# the author of a change bumps lib/periods/version.rb in the PR when a release is warranted, and this
# workflow publishes and tags v<version> only if that tag does not exist yet. A merge that does not
# change the version publishes nothing (see "CI and Releasing" in README.md).
#
# Interim copy of network-for-good/nfg-devx .github/workflows/gem-publish.yml at
# 586acd68bdc210adda991b27b77ff9239da67e26 (gem-workflows-v1.0.0), NFG-4979, with the gem's inputs
# filled in. nfg-devx is private and periods is public, so this repo cannot call the shared workflow.
# Replace this file with a thin caller once a shared public workflows repo exists. The release-check
# logic lives in .github/scripts/release-check.sh, copied from the same source.
#
# Least privilege (NFG-5012): the `build` job runs repository code (bundle install, rake build) with a
# READ-ONLY token and uploads the .gem as an artifact. Only the small `publish` job holds
# packages: write and contents: write; it runs no repository code, it pushes the artifact and the tag,
# authenticating with the workflow's own GITHUB_TOKEN. The test suite gates the release (`needs: test`).
# Actions are pinned to full commit SHAs (ITD-003) and the runner is pinned (NFG-5011).

on:
  push:
    branches:
      - main

permissions:
  contents: read

# One publish at a time: two quick merges would otherwise both see the release tag as missing and
# both try to upload the same version. Never cancel an upload that is in flight.
concurrency:
  group: gem-publish-${{ github.repository }}-periods
  cancel-in-progress: false

env:
  GEM_NAME: periods
  VERSION_FILE: lib/periods/version.rb
  VERSION_CONST: Periods::VERSION
  TAG_PREFIX: v
  RUBY_VERSION_FOR_CI: '3.4.2'

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test # a red suite on main stops the release
    runs-on: ubuntu-24.04
    # Read-only. Repository code runs here, so nothing that can publish or push is available.
    permissions:
      contents: read
      packages: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      recover_sha: ${{ steps.check.outputs.recover_sha }}
      sha: ${{ github.sha }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # the tag-recovery check walks history back to the version bump

      # No bundler-cache: dependencies are only installed once the check says there is something to
      # publish, so a merge that doesn't release anything doesn't pay for a bundle install.
      # ruby/setup-ruby v1.338.0
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: ${{ env.RUBY_VERSION_FOR_CI }}

      # Decides between "nothing to do", "publish", and "only the release tag is missing" (a previous
      # run published the package but failed to push the tag). Read-only: the publish job acts on it.
      - name: Check whether this version was already published
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/release-check.sh

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: bundle install --jobs 4 --retry 3

      - name: Build the gem
        if: steps.check.outputs.publish == 'true'
        env:
          GEM_FILE: pkg/periods-${{ steps.check.outputs.version }}.gem
        run: |
          bundle exec rake build
          test -s "$GEM_FILE" || { echo "::error::rake build did not produce $GEM_FILE"; exit 1; }

      # actions/upload-artifact v7.0.2
      - name: Upload the gem
        if: steps.check.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gem
          path: pkg/periods-${{ steps.check.outputs.version }}.gem
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true' || needs.build.outputs.recover_sha != ''
    runs-on: ubuntu-24.04
    # The only job with write credentials. It runs no repository code: it pushes the artifact
    # built above and the tag.
    permissions:
      contents: write
      packages: write
    steps:
      # The commit that was built (or, when recovering, the commit the published package was
      # built from), so a push that arrived meanwhile cannot get tagged by mistake.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Download the gem
        if: needs.build.outputs.publish == 'true'
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: gem
          path: dist

      # Only `gem push` is needed here, not the project's dependencies.
      # ruby/setup-ruby v1.338.0
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        if: needs.build.outputs.publish == 'true'
        with:
          ruby-version: ${{ env.RUBY_VERSION_FOR_CI }}

      - name: Publish to GitHub Packages
        if: needs.build.outputs.publish == 'true'
        env:
          GEM_FILE: dist/periods-${{ needs.build.outputs.version }}.gem
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_HOST: https://rubygems.pkg.github.com/${{ github.repository_owner }}
        run: |
          mkdir -p ~/.gem
          printf -- '---\n:github: Bearer %s\n' "$GITHUB_TOKEN" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push --key github --host "$REGISTRY_HOST" "$GEM_FILE"

      - name: Tag the release
        env:
          TAG: ${{ needs.build.outputs.tag }}
          # Normal publish: the built commit. Recovery: the commit the published package matches.
          TARGET_SHA: ${{ needs.build.outputs.recover_sha || needs.build.outputs.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$TARGET_SHA" || git fetch --no-tags origin
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "release ${TAG}"
          git push origin "refs/tags/${TAG}"
